description: >-
  Claude Code, Codex and pi in tmux, with nvim, node and a JUCE
  toolchain for soundor — cmake, ninja, clang, lld and JUCE in
  /opt/JUCE — behind a Surfshark tunnel and a firewall that reaches the
  three agents, github and npm and nothing else.

# JUCE LICENCE — read before the first `up`. The image clones JUCE into
# /opt/JUCE, and JUCE is not free to use however you like: it is AGPLv3 or a
# commercial JUCE licence (https://juce.com/legal/juce-8-licence). Building
# this cell is using JUCE under one of them. Never publish the built image —
# it contains JUCE — and never ship a plugin built here without meeting the
# licence you chose. See the README's JUCE section.
build: ./Containerfile

# Sets up what has to live in the cell's home — the MCP servers and pi's agent
# directory — then keeps the container alive.
command: /usr/local/bin/cell-init; sleep infinity

# gh reads GH_TOKEN. The agents are not here: Claude Code, Codex and pi all log in
# inside the cell and keep their credentials in /home/cell, which lives on the
# machine's disk and outlives the container. The git identity is not here
# either: it comes from git: in ~/.config/solitary/config.yaml.
secrets:
  GH_TOKEN:
    description: a token gh and git push authenticate with

# Only this port reaches the host. Everything else the cell listens on stays
# inside it.
ports:
  - 3000
  - 5173

# A GPU to render with, shared with the host rather than taken from it: the
# machine gets a virtual one, and the host runs its OpenGL (virgl) and Vulkan
# (Venus) on a real card. Rendering only — no CUDA, no NVENC. Which card is the
# host's to say, not this file's: solitary picks the discrete one, and gpu: in
# config.yaml overrides it. A host with none starts the cell anyway, rendering
# on the CPU.
gpu: true

# What this cell may reach. Everything else — the rest of the internet, the
# host, the local network — is refused, and an unlisted name does not even
# resolve. A domain covers its subdomains, so this list is shorter than the set
# of hosts actually contacted.
#
# The build needs most of these: the image is built inside the machine, behind
# the same firewall, so a package source missing here fails the build rather
# than the cell.
network:
  # And it leaves through Surfshark rather than this host's connection. The
  # configuration is not here: it holds a private key, so it is yours to
  # provide and is kept out of anything this directory is copied into.
  #
  # With the tunnel up, what is allowed below is reachable through it and
  # nowhere else — if it drops, the cell reaches nothing at all.
  vpn: ./vpn.conf

  # Forwarded to a public resolver rather than the host's, so the machine has
  # no reason to reach the host at all. Every name this cell resolves is one
  # of the few below. Once the tunnel is up these queries go through it too,
  # so 1.1.1.1 is asked from Berlin rather than from here.
  resolvers:
    - 1.1.1.1

  allow:
    - anthropic.com # Claude Code: api, console, telemetry
    - claude.ai # signing in
    - claude.com # what Claude Code reaches for docs and account
    - chatgpt.com # Codex, and pi's default provider: the Codex backend
    - openai.com # and the auth and api hosts behind both
    - pi.dev # pi's version check and changelog
    - opencode.ai # opencode: install script, api and docs
    - mcp.context7.com # the context7 MCP server, for Claude Code and pi
    - github.com # gh, git clones, releases, the apt repo for gh
    - githubusercontent.com # raw scripts and release assets
    - npmjs.org # npm, and what mason installs from it
    - nodejs.org # the node nvm installs
    - ubuntu.com # apt
    - docker.io # the base image
    - docker.com # and the CDN it is served from
    - crates.io # cargo: the index, the crate downloads and the API
    - rust-lang.org # rustup and the toolchain it installs
    - cdn.playwright.dev # the chromium build playwright downloads
    - storage.googleapis.com # which is where that download redirects
    - skia.googlesource.com # Skia source and mirrored deps
    - chromium.googlesource.com # buildtools, ANGLE, Chromium-hosted deps
    - chrome-infra-packages.appspot.com # CIPD tools/packages used by Skia

# Memory is the ceiling on the host rather than a preference: a machine's
# memory is a file on the host's /dev/shm, and this host mounts 7.6GiB of it.
# A machine larger than the mount starts, reports itself running and then dies
# with no error, so more than the mount means raising /dev/shm first.
#
# 7 fit until the image gained a browser, and then it did not: the margin was
# the ~200MiB between a 7GiB memory file and the mount, and Playwright's
# download and unzip are the first thing in the build that makes the guest
# touch nearly all of its RAM. The host cannot back the next page, and the
# guest takes it as a machine check while clearing one — qemu prints a register
# dump, stops, and Lima goes on reporting the machine as running. 6 leaves
# enough room that the build finishes.
vm:
  cpus: 4
  memory: 6GiB
  disk: 40GiB
