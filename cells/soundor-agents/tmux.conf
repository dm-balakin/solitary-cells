# Installed as /etc/tmux.conf. tmux reads it before ~/.tmux.conf, and unlike a
# file in the home directory it survives: the cell's home is a mount from the
# machine, which hides anything the image puts under it.
#
# A copy of the host's ~/.config/tmux/tmux.conf, with paths moved from
# ~/.config/tmux to /etc/tmux, and ~/.tmux.conf folded in.

set-option -g status-position top

# TPM keeps its plugins here. Set before the plugins are declared.
set-environment -g TMUX_PLUGIN_MANAGER_PATH '/etc/tmux/plugins/'

# ===========================================
# Catppuccin Theme (Mocha)
# ===========================================

set -g @plugin 'catppuccin/tmux'
set -g @catppuccin_flavor 'mocha'

# Status bar modules (optional extras)
set -g @catppuccin_window_status_style "rounded"
# Keep workmux's per-window agent status inside the Catppuccin pill.
set -g @catppuccin_window_text " #T#{?@workmux_status, #{@workmux_status},}"
set -g @catppuccin_window_current_text " #T#{?@workmux_status, #{@workmux_status},}"
set -g @catppuccin_status_left_separator " "
set -g @catppuccin_status_right_separator ""
set -g @catppuccin_status_connect_separator "no"

# ===========================================
# General Settings
# ===========================================

# Enable mouse support
set -g mouse on

# Start window/pane numbering at 1
set -g base-index 1
setw -g pane-base-index 1

# Increase history limit
set -g history-limit 50000

# Preserve modified keys such as Shift+Enter for Pi
set -g extended-keys on
set -g extended-keys-format csi-u

# Reduce escape key delay
set -g escape-time 0

# Increase display time
set -g display-time 2000

# ===========================================
# Copy Mode
# ===========================================

# Use vi keybindings in copy mode
setw -g mode-keys vi

# ===========================================
# Key Bindings
# ===========================================

# Reload config
bind r source-file /etc/tmux.conf \; display "Config reloaded!"

# Split panes with intuitive keys
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# New window in current path
bind c new-window -c "#{pane_current_path}"

# ===========================================
# TPM Plugins
# ===========================================

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# ===========================================
# Initialize TPM (keep at bottom)
# ===========================================

run '/etc/tmux/plugins/tpm/tpm'

# Show live system information instead of repeating the active pane title.
set -g status-right '#(/etc/tmux/system-stats.sh) | %H:%M %d-%b-%y'
set -g status-right-length 75
